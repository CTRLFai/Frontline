<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-180.png">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Frontline">
<meta name="theme-color" content="#16203a">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>Frontline</title>
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;-webkit-user-select:none;user-select:none}
html,body{-webkit-touch-callout:none;margin:0;height:100%;background:#000;font-family:-apple-system,BlinkMacSystemFont,"Helvetica Neue",Arial,sans-serif;overflow:hidden;touch-action:manipulation}
/* ---------- game (always landscape) ---------- */
#app{position:fixed;top:0;left:0;transform-origin:top left;display:none;background:#000;box-sizing:border-box;padding:0 env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left)}
body.ingame #app{display:flex}
#mapArea.ras{background:#0e1626 !important}
#mapArea{position:relative;touch-action:none;overflow:hidden;flex:1;min-width:0;background:radial-gradient(ellipse at 50% 40%,#bfe9f7,#8fd0ea 70%,#7cc3e0)}
#map{position:absolute;inset:0;width:100%;height:100%;display:block}
.terr{stroke:rgba(20,20,20,.55);stroke-width:.9;cursor:pointer}
.mk circle{stroke:rgba(0,0,0,.45);stroke-width:1}
.mk text{fill:#fff;font-weight:800;font-size:15px;text-anchor:middle;dominant-baseline:central;paint-order:stroke;stroke:rgba(0,0,0,.55);stroke-width:2.5px}
.mk,.arrow,.clbl{pointer-events:none}
.clbl{display:none}
svg.bonus .clbl{display:block}
svg.bonus .mk{display:none}
.clbl text{font-weight:800;font-size:22px;fill:#111;text-anchor:middle;dominant-baseline:central;paint-order:stroke;stroke:#fff;stroke-width:3px}
.card{cursor:pointer}
.card text{text-anchor:middle;font-weight:700;fill:#222}
#legend.free{border-radius:10px;border:2px solid #cfcfcf}
#legend{touch-action:none;cursor:move;position:absolute;left:0;bottom:0;background:rgba(250,250,250,.92);border-top-right-radius:7px;border:2px solid #cfcfcf;border-left:0;border-bottom:0;padding:1px 3px 0;box-shadow:0 0 8px rgba(0,0,0,.35)}
#legend table{border-collapse:collapse}
#legend th{padding:1px 2px 2px;border-bottom:1.5px solid #c9c9c9}
#legend th svg{width:19px;height:15px;display:block;margin:auto}
#legend td{font-weight:800;font-size:15px;text-align:center;padding:0 2px;min-width:25px;line-height:18px;border-top:1px solid #d8d8d8;font-variant-numeric:tabular-nums}
#banner{position:absolute;right:0;bottom:0;color:#fff;font-weight:800;font-size:27px;padding:2px 12px 3px 14px;border-top-left-radius:9px;text-shadow:0 1px 2px rgba(0,0,0,.7);max-width:78%;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;pointer-events:none}
#side{flex:none;width:96px;overflow:hidden;background:linear-gradient(90deg,#1a2138,#3b4768 45%,#26304e);display:flex;flex-direction:column;align-items:center;padding:4px 0;padding-right:env(safe-area-inset-right);border-left:1px solid #0c1020}
.sb{background:none;border:0;color:#fff;font-weight:800;font-size:15px;text-shadow:0 1px 2px #000,0 0 3px #000;display:flex;flex-direction:column;align-items:center;padding:3px 0;width:100%;cursor:pointer;font-family:inherit}
.sb svg{width:46px;height:42px;filter:drop-shadow(0 1px 1px #000)}
.sb.menu{font-size:21px;padding:4px 0 6px}
.sb.on svg{filter:drop-shadow(0 0 5px #ffe066)}
.sb:disabled{opacity:.35}
.place{color:#fff;text-align:center;text-shadow:0 1px 2px #000;font-weight:800;margin-top:auto}
.place .n{font-size:40px;line-height:44px}
.place .l{font-size:16px;line-height:18px}
.grow{flex:1}
#sideIn{display:flex;flex-direction:column;align-items:center;width:100%;min-height:100%}
/* ---------- modal ---------- */
#modal{position:absolute;inset:0;background:rgba(0,0,0,.55);display:none;align-items:center;justify-content:center;z-index:20}
#modal.show{display:flex}
#box{background:linear-gradient(#3b4768,#1d2540);border:2px solid #8792b0;border-radius:12px;padding:14px 18px;min-width:280px;max-width:90%;max-height:92%;overflow:auto;color:#fff;text-shadow:0 1px 1px #000}
#box h2{margin:0 0 8px;font-size:20px}
#box p{margin:5px 0;font-size:14px}
.btns{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}
.btn{flex:1;background:linear-gradient(#5d6d96,#36426a);border:1px solid #9aa6c6;color:#fff;font:700 16px inherit;font-family:inherit;padding:9px 12px;border-radius:8px;text-shadow:0 1px 1px #000;cursor:pointer}
.btn.pri{background:linear-gradient(#4a7bd6,#24479a)}
input[type=range]{width:100%;height:30px}
.big{font-size:34px;font-weight:800;text-align:center}
#logList{font-size:13px;max-height:55vh;overflow:auto}
#logList div{padding:2px 0;border-bottom:1px solid rgba(255,255,255,.15)}
/* ---------- setup (iOS style) ---------- */
#setup{position:fixed;inset:0;overflow:auto;background:linear-gradient(160deg,#b9a27a 0%,#d9cdb6 30%,#c9c3d6 65%,#8d7aa6 100%);-webkit-overflow-scrolling:touch}
body.ingame #setup{display:none}
.nav{position:sticky;top:0;z-index:2;display:flex;align-items:center;justify-content:space-between;height:56px;padding:0 14px;padding-top:env(safe-area-inset-top);box-sizing:content-box;background:linear-gradient(#f2f2f4,#e1e1e6);border-bottom:1px solid #b9b9c0}
.nav .t{font-weight:700;font-size:20px;color:#000;position:absolute;left:0;right:0;text-align:center;pointer-events:none}
.nav a{color:#0a64ff;font-size:19px;cursor:pointer;z-index:1;min-width:60px}
.nav a.r{text-align:right}
.nav a.dis{color:#9bb7e8}
.sec{background:#fff;margin:18px 0;border-top:1px solid #c8c7cc;border-bottom:1px solid #c8c7cc}
.cell{display:flex;align-items:center;min-height:62px;padding:6px 14px;cursor:pointer;position:relative}
.cell+.cell:before{content:"";position:absolute;top:0;left:62px;right:0;border-top:1px solid #d6d6da}
.cell .main{flex:1;font-size:21px;font-weight:600;color:#000}
.cell .val{color:#2c4fbf;font-size:19px;margin-right:8px}
.cell .chev{color:#c4c4c9;font-size:22px;font-weight:300}
.cell .sub{display:block;font-size:19px;font-weight:400;color:#2c4fbf}
.cell .by{display:block;font-size:17px;font-weight:400;color:#8a8a8e}
.cell .chk{color:#0a64ff;font-size:22px;font-weight:700}
.splat{width:46px;height:40px;margin-right:16px;flex:none}
.thumb{width:84px;height:64px;border-radius:10px;margin-right:16px;flex:none;overflow:hidden;background:#8fd0ea}
.note{text-align:center;color:#3a3340;font-size:14px;padding:0 20px}
.warn{color:#b00020}
</style>
</head>
<body>
<div id="setup"></div>
<div id="app">
  <div id="mapArea">
    <svg id="map" xmlns="http://www.w3.org/2000/svg" preserveAspectRatio="none"></svg>
    <div id="legend"></div>
    <div id="banner"></div>
  </div>
  <div id="side"></div>
  <div id="modal"><div id="box"></div></div>
</div>

const isHuman=p=>!p.ai;

function tradeValue(k){const v=SEQS[G.seq].v;return k<v.length?v[k]:v[v.length-1]+5*(k-v.length+1)}
function isSet(cs){if(cs.length!==3)return false;if(cs.some(c=>c.s===3))return true;const s=new Set(cs.map(c=>c.s));return s.size===1||s.size===3}
function findSet(cards){let fb=null;for(let i=0;i<cards.length;i++)for(let j=i+1;j<cards.length;j++)for(let k=j+1;k<cards.length;k++){const cs=[cards[i],cards[j],cards[k]];if(isSet(cs)){if(!cs.some(c=>c.s===3))return[i,j,k];fb=fb||[i,j,k]}}return fb}

function doTrade(pi,idxs){const p=G.players[pi],val=tradeValue(G.trades);G.trades++;
 const cs=idxs.map(i=>p.cards[i]);p.cards=p.cards.filter((c,i)=>!idxs.includes(i));

 G.armies[f]-=al;G.armies[t]-=dl;if(G.armies[t]<0)G.armies[t]=0;return{won:G.armies[t]===0,a}}

function aiGoal(pi){let best=null,bs=-1;for(const c in CONT){const ts=TER.filter(t=>t.c===c),own=ts.filter(t=>G.owner[t.id]===pi).length;if(own===ts.length)continue;
 const enemy=ts.filter(t=>G.owner[t.id]!==pi).reduce((s,t)=>s+G.armies[t.id],0);const s=(contBonus(c)+1)*(own+1)/(enemy+ts.length);if(s>bs){bs=s;best=c}}return best}
function aiPlace(pi,lvl){let n=G.reinforce;if(n<=0)return;
 const borders=TER.filter(t=>G.owner[t.id]===pi&&enemyNbrs(t.id).length).map(t=>t.id);
 if(!borders.length){G.armies[TER.find(t=>G.owner[t.id]===pi).id]+=n;G.reinforce=0;return}
 if(lvl==='easy'){while(n>0){const k=Math.min(n,1+rnd(3));G.armies[borders[rnd(borders.length)]]+=k;n-=k}G.reinforce=0;return}
 if(lvl==='hard'){let worst=null,ws=0;for(const b of borders){if(!ownsCont(pi,CONT_OF[b]))continue;const th=enemyNbrs(b).reduce((s,e)=>s+G.armies[e],0)-G.armies[b];if(th>ws){ws=th;worst=b}}
  if(worst){const k=Math.min(n,ws,Math.floor(n/2));G.armies[worst]+=k;n-=k}}
 const goal=aiGoal(pi);let best=borders[0],bs=-1e9;
 for(const b of borders)for(const e of enemyNbrs(b)){let s=G.armies[b]-G.armies[e];if(CONT_OF[e]===goal)s+=15;if(ownsCont(G.owner[e],CONT_OF[e]))s+=6;if(s>bs){bs=s;best=b}}
 G.armies[best]+=n;G.reinforce=0}
function aiPickAttack(pi,lvl){const goal=aiGoal(pi),need={easy:1.5,normal:1.2,hard:1}[lvl];let best=null,bs=-1e9;
 for(const t of TER){const f=t.id;if(G.owner[f]!==pi||G.armies[f]<2)continue;
  for(const e of ADJ[f]){if(G.owner[e]===pi)continue;const af=G.armies[f]-1,ae=G.armies[e];
   if(af<2&&!(ae===1&&!G.conquered))continue;if(af<ae*need)continue;
   let s=af-ae;if(CONT_OF[e]===goal)s+=8;if(lvl!=='easy'&&ownsCont(G.owner[e],CONT_OF[e]))s+=10;if(!G.conquered)s+=4;if(lvl==='easy')s+=rnd(10);
   if(s>bs){bs=s;best=[f,e]}}}
 if(best&&lvl==='easy'&&G.conquered&&Math.random()<0.25)return null;return best}
function aiMoveCount(f,t,min,max){if(!enemyNbrs(f).length)return max;if(!enemyNbrs(t).length)return min;return Math.max(min,Math.ceil(max*0.6))}
function aiFortify(pi,lvl){if(lvl==='easy'&&Math.random()<0.5)return;let src=null,sa=1;
 for(const t of TER){const id=t.id;if(G.owner[id]===pi&&G.armies[id]>sa&&!enemyNbrs(id).length){sa=G.armies[id];src=id}}
 if(!src)return;let dst=null,ds=-1e9;for(const id of connected(src)){const en=enemyNbrs(id);if(!en.length)continue;const s=en.reduce((s,e)=>s+G.armies[e],0)-G.armies[id];if(s>ds){ds=s;dst=id}}
 if(dst){const n=G.armies[src]-1;moveArmies(src,dst,n);log(`${G.players[pi].name} moved ${n} to ${NAME[dst]}`)}}
async function runAI(){busy=true;const gid=G.gid,pi=G.cur,p=G.players[pi],lvl=p.ai,gone=()=>!G||G.gid!==gid;let over=false;
 const D=async()=>{await sleep(SPEEDS[G.speed]);if(gone())throw'stale'};
 try{
  while(p.cards.length>=5||(lvl!=='easy'&&findSet(p.cards))){const s=findSet(p.cards);if(!s)break;doTrade(pi,s)}
  render();await D();aiPlace(pi,lvl);G.phase='attack';render();await D();
  for(let g=0;g<200;g++){const mv=aiPickAttack(pi,lvl);if(!mv)break;const[f,t]=mv;G.sel=f;G.aiTarget=t;render();await D();
   const K={easy:1.3,normal:1.1,hard:1}[lvl];let r;
   do{r=battle(f,t)}while(!r.won&&G.armies[f]>1&&G.armies[f]-1>=G.armies[t]*K);
   if(r.won){capture(f,t);if(checkWin()){over=true;return}
    const max=G.armies[f]-1,min=Math.min(r.a,max);moveArmies(f,t,aiMoveCount(f,t,min,max));
    if(p.cards.length>=6){G.reinforce=0;while(p.cards.length>=5){const s=findSet(p.cards);if(!s)break;doTrade(pi,s)}aiPlace(pi,lvl)}}
   G.aiTarget=null;render()}
  G.sel=null;G.aiTarget=null;G.phase='fortify';aiFortify(pi,lvl);render();await D();
 }catch(e){if(e==='stale')return;console.error(e)}finally{if(!gone())busy=false}
 if(!over&&!gone()&&G.phase!=='over')endTurn()}

/* ---------- human ---------- */
function canAct(){return G&&!busy&&G.phase!=='over'&&!G.players[G.cur].ai&&!modalLock}
function movable(id){return G.armies[id]-1-(G.arrived[id]||0)}
function onTap(id){if(Date.now()<suppressUntil)return;if(bonusView){toggleBonus();return}if(!canAct()||G.prompt)return;const me=G.cur;
 if(G.phase==='reinforce'){if(G.owner[id]!==me)return;place(id,G.step===0?G.reinforce:G.step);return}
 if(G.phase==='attack'){
  if(G.owner[id]===me){if(id===G.sel)G.sel=null;else if(G.armies[id]>1&&enemyNbrs(id).length)G.sel=id;render();return}
  if(G.sel&&ADJ[G.sel].includes(id)){humanAttack(G.sel,id);return}
  return}
 if(G.phase==='fortify'){
  if(G.owner[id]!==me)return;
  if(G.sel&&G.sel!==id&&ADJ[G.sel].includes(id)){const m=movable(G.sel);
   if(G.mv==='manual'&&m>1)openMove('fortify',G.sel,id,1,m);else doFortify(G.sel,id,m);return}
  if(id===G.sel)G.sel=null;else if(movable(id)>0&&ADJ[id].some(n=>G.owner[n]===me))G.sel=id;render()}}
function place(id,n){n=Math.min(n,G.reinforce);if(n<=0)return;G.armies[id]+=n;G.reinforce-=n;if(G.reinforce===0){G.phase='attack';G.sel=null}save();render()}
/* long press: armies keep coming, faster the longer you hold */
let hold=null,suppressUntil=0,slide=null;const suppress=()=>{suppressUntil=Date.now()+450};
function holdStart(id,e){if(!canAct()||G.prompt||bonusView)return;
 if(G.phase==='attack'&&G.sel&&G.owner[id]!==G.cur&&ADJ[G.sel].includes(id)&&G.armies[G.sel]>1){holdCancel();
  hold={kind:'atk',id,held:false,x:e.clientX,y:e.clientY,timer:setTimeout(()=>{if(!hold||dragged||(touch&&touch.pinch)){holdCancel();return}
   hold.held=true;suppress();humanAttack(G.sel,id,true)},400)};return}
 if(G.phase!=='reinforce'||G.owner[id]!==G.cur)return;
 holdCancel();hold={kind:'place',id,held:false,x:e.clientX,y:e.clientY,n:0,iv:140,timer:setTimeout(holdTick,320)}}
function holdTick(){if(!hold)return;if(dragged||(touch&&touch.pinch)||G.phase!=='reinforce'){holdCancel();return}
 hold.held=true;place(hold.id,hold.n<8?1:hold.n<20?2:5);hold.n++;hold.iv=Math.max(28,hold.iv*0.86);
 if(G.phase==='reinforce'&&G.reinforce>0)hold.timer=setTimeout(holdTick,hold.iv)}
function holdCancel(){if(hold){clearTimeout(hold.timer);hold=null}}
function holdEnd(){if(!hold)return;clearTimeout(hold.timer);const h=hold;hold=null;if(h.kind==='atk')return;suppress();
 if(!h.held&&!dragged&&canAct()&&G.phase==='reinforce')place(h.id,G.step===0?G.reinforce:G.step)}
function territoryAt(cx,cy){const p=toSvg(cx,cy);if(RAS){const x=Math.floor(p.x),y=Math.floor(p.y);if(x>=0&&y>=0&&x<RAS.W&&y<RAS.H){const k=RAS.idx[RAS.L[y*RAS.W+x]];if(k>=0)return TER[k].id}}
 else{const el=document.elementFromPoint(cx,cy);if(el&&el.dataset&&el.dataset.id)return el.dataset.id;
  /* tap landed on a border, coast or sea: use the territory whose outline is under or closest to the finger */
  let best=null,bd=22;for(const t of TER){for(const q of t.polys){let inside=false;for(let i=0,j=q.length-1;i<q.length;j=i++){const[xi,yi]=q[i],[xj,yj]=q[j];
    if((yi>p.y)!==(yj>p.y)&&p.x<(xj-xi)*(p.y-yi)/(yj-yi)+xi)inside=!inside;
    const dx=xj-xi,dy=yj-yi,L=dx*dx+dy*dy||1,u=Math.max(0,Math.min(1,((p.x-xi)*dx+(p.y-yi)*dy)/L)),d=Math.hypot(xi+u*dx-p.x,yi+u*dy-p.y);if(d<bd){bd=d;best=t.id}}
   if(inside)return t.id}}if(best)return best}
 let best=null,bd=RAS?30:70;for(const t of TER){const d=Math.hypot(t.x-p.x,t.y-p.y);if(d<bd){bd=d;best=t.id}}return best}
function territoryExact(cx,cy){const p=toSvg(cx,cy);
 if(RAS){const x=Math.floor(p.x),y=Math.floor(p.y);if(x<0||y<0||x>=RAS.W||y>=RAS.H)return null;const k=RAS.idx[RAS.L[y*RAS.W+x]];return k>=0?TER[k].id:null}
 for(const t of TER)for(const q of t.polys){let r=false;for(let i=0,j=q.length-1;i<q.length;j=i++){const[xi,yi]=q[i],[xj,yj]=q[j];if((yi>p.y)!==(yj>p.y)&&p.x<(xj-xi)*(p.y-yi)/(yj-yi)+xi)r=!r}if(r)return t.id}return null}
/* look at a small area around the fingertip and pick what the player most likely meant */
function resolveTap(cx,cy){const C=new Map();for(const r of[0,6,12,18,24]){const n=r?12:1;for(let k=0;k<n;k++){const a=k*Math.PI/6,id=territoryExact(cx+r*Math.cos(a),cy+r*Math.sin(a));if(id&&!C.has(id))C.set(id,r)}}
 if(!C.size)return territoryAt(cx,cy);const L=[...C.entries()].sort((a,b)=>a[1]-b[1]),exact=L[0][1]===0?L[0][0]:null;
 const near=(f,max)=>{const c=L.find(([id,r])=>r<=max&&f(id));return c?c[0]:null};
 if(G&&canAct()&&!G.prompt){const me=G.cur;
  const target=G.sel&&(G.phase==='attack'?id=>G.owner[id]!==me&&ADJ[G.sel].includes(id):G.phase==='fortify'?id=>id!==G.sel&&G.owner[id]===me&&ADJ[G.sel].includes(id):null);
  if(target){if(exact&&target(exact))return exact;
   const mineSelectable=exact&&exact!==G.sel&&G.owner[exact]===me;
   if(!mineSelectable){const t=near(target,exact===G.sel?6:24);if(t)return t}}
  if(G.phase==='reinforce'){if(exact&&G.owner[exact]===me)return exact;const t=near(id=>G.owner[id]===me,18);if(t)return t}}
 return exact||L[0][0]}
function slideStart(id,e){if(!canAct()||G.prompt||bonusView||G.owner[id]!==G.cur||(G.phase!=='attack'&&G.phase!=='fortify'))return;slide={from:id,x:e.clientX,y:e.clientY,moved:false}}
function slideEnd(e){const s=slide;slide=null;if(!s||!s.moved||!canAct())return;const ps=G.sel;G.sel=s.from;const to=resolveTap(e.clientX,e.clientY);G.sel=ps;if(!to||to===s.from||!ADJ[s.from].includes(to))return;
 suppress();holdCancel();
 if(G.phase==='attack'&&G.owner[to]!==G.cur&&G.armies[s.from]>1){G.sel=s.from;humanAttack(s.from,to);return}
 if(G.phase==='fortify'&&G.owner[to]===G.cur&&movable(s.from)>0){G.sel=s.from;const m=movable(s.from);if(G.mv==='manual'&&m>1)openMove('fortify',s.from,to,1,m);else doFortify(s.from,to,m)}}
addEventListener('pointerup',e=>{slideEnd(e)});
addEventListener('pointerup',holdEnd);addEventListener('pointercancel',holdCancel);
addEventListener('pointermove',e=>{if(hold&&Math.hypot(e.clientX-hold.x,e.clientY-hold.y)>10)holdCancel();if(slide&&!slide.moved&&Math.hypot(e.clientX-slide.x,e.clientY-slide.y)>14)slide.moved=true});
addEventListener('pointercancel',()=>{slide=null});
function humanAttack(f,t,forceAuto){if(G.armies[f]<2)return;let r;const auto=forceAuto||G.atk==='auto';
 do{r=battle(f,t)}while(auto&&!r.won&&G.armies[f]>1);
 if(r.won){capture(f,t);if(checkWin())return;const max=G.armies[f]-1,min=Math.min(r.a,max);
  if(G.mv==='manual'&&max>min){save();render();openMove('conquer',f,t,min,max);return}
  moveArmies(f,t,max);afterConquer(f,t);return}
 if(G.armies[f]<2)G.sel=null;save();render()}
function afterConquer(f,t){
 G.sel=(G.armies[t]>1&&enemyNbrs(t).length)?t:(G.armies[f]>1&&enemyNbrs(f).length)?f:null;
 if(G.players[G.cur].cards.length>=6){G.phase='reinforce';G.reinforce=0;G.sel=null;save();render();maybePrompt();return}
 save();render()}
function doFortify(f,t,n){moveArmies(f,t,n);G.arrived[t]=(G.arrived[t]||0)+n;G.sel=null;log(`${G.players[G.cur].name} moved ${n} to ${NAME[t]}`);save();render()}
function toFortify(){if(!canAct())return;G.phase='fortify';G.sel=null;G.arrived={};save();render()}
function toggleAtk(){G.atk=G.atk==='one'?'auto':'one';save();render()}
function toggleMv(){G.mv=G.mv==='manual'?'auto':'manual';save();render()}
function cycleStep(){G.step=G.step===1?5:G.step===5?0:1;render()}
/* cards */
function maybePrompt(){const p=G.players[G.cur];const s=findSet(p.cards);if(!s)return;G.prompt={forced:p.cards.length>=5,picks:s};render()}
function pickCard(i){const pr=G.prompt;if(!pr)return;const k=pr.picks.indexOf(i);if(k>=0)pr.picks.splice(k,1);else if(pr.picks.length<3)pr.picks.push(i);render()}
function cash(){const p=G.players[G.cur],pr=G.prompt;if(!pr||!isSet(pr.picks.map(i=>p.cards[i])))return;doTrade(G.cur,pr.picks);G.prompt=null;save();maybePrompt();render()}
function later(){if(G.prompt&&!G.prompt.forced){G.prompt=null;render()}}

/* ---------- modals ---------- */
function showModal(html,lock){$('#box').innerHTML=html;$('#modal').classList.add('show');modalLock=!!lock}
function hideModal(){$('#modal').classList.remove('show');$('#box').innerHTML='';modalLock=false}
$('#modal').addEventListener('click',e=>{if(e.target.id==='modal'&&!modalLock)hideModal()});
let mv=null;
function openMove(kind,f,t,min,max){mv={kind,f,t,min,max,val:max};
 showModal(`<h2>${kind==='conquer'?'Conquered '+NAME[t]:'Fortify '+NAME[t]}</h2><p>Move armies from ${NAME[f]}</p>
 <div class="big" id="mvv">${max}</div><input type="range" id="mvr" min="${min}" max="${max}" value="${max}" oninput="mv.val=+this.value;$('#mvv').textContent=this.value">
 <div class="btns"><button class="btn" onclick="mvSet(${min})">Min</button><button class="btn" onclick="mvSet(${max})">Max</button><button class="btn pri" onclick="doMove()">Move</button>${kind==='fortify'?'<button class="btn" onclick="hideModal()">Cancel</button>':''}</div>`,kind==='conquer')}
function mvSet(v){mv.val=v;$('#mvr').value=v;$('#mvv').textContent=v}
function doMove(){const m=mv;if(!m)return;mv=null;hideModal();if(m.kind==='conquer'){moveArmies(m.f,m.t,m.val);afterConquer(m.f,m.t)}else doFortify(m.f,m.t,m.val)}
function openMenu(){if(!G)return;
 showModal(`<h2>Menu</h2>
 <p>AI speed</p><div class="btns">${Object.keys(SPEEDS).map(x=>`<button class="btn ${G.speed===x?'pri':''}" onclick="G.speed='${x}';save();openMenu()">${SPEEDNAME[x]}</button>`).join('')}</div>
 <div class="btns"><button class="btn" onclick="openLog()">Game Log</button><button class="btn" onclick="openHelp()">Help</button></div>
 <div class="btns"><button class="btn" onclick="toSetup()">New Game</button><button class="btn pri" onclick="hideModal()">Resume</button></div>`)}
function openLog(){showModal(`<h2>Game Log</h2><div id="logList">${G.log.slice().reverse().map(l=>`<div>${l}</div>`).join('')}</div><div class="btns"><button class="btn" onclick="openMenu()">Back</button></div>`)}

/* ---------- save ---------- */
function save(){try{if(G)localStorage.setItem('frontline-save',JSON.stringify(G))}catch(e){}}
function loadSave(){try{const s=localStorage.getItem('frontline-save');return s?JSON.parse(s):null}catch(e){return null}}
async function resume(){const s=loadSave();if(!s)return;if(!(await loadMap(s.map||'classic'))){setupNote='That saved game used a map that is no longer on this device.';renderSetup();return}buildMap();G=s;if(!G.arrived)G.arrived={};enterGame();render();if(G.players[G.cur].ai)runAI()}

async function decodeImg(url,W,H){const img=new Image();img.src=url;await img.decode();W=W||img.naturalWidth;H=H||img.naturalHeight;const c=document.createElement('canvas');c.width=W;c.height=H;const x=c.getContext('2d');x.imageSmoothingEnabled=false;x.drawImage(img,0,0,W,H);return{W,H,d:x.getImageData(0,0,W,H).data}}
async function prepRaster(m){const lab=await decodeImg(m.labURL,m.W,m.H),pic=await decodeImg(m.picURL,m.W,m.H);const N=m.W*m.H,L=new Uint8Array(N),lum=new Float32Array(N);
 for(let i=0;i<N;i++){L[i]=lab.d[i*4];const r=pic.d[i*4],g=pic.d[i*4+1],b=pic.d[i*4+2];lum[i]=.62+.5*((.3*r+.59*g+.11*b)/255)}m.labData=L;m.lum=lum}
async function loadMap(id){try{if(!id||id==='classic'){setMapData(WORLD);return true}
 let m=MAPCACHE[id];
 if(!m){if(id.startsWith('imp_')){const r=await idb('get',id);if(!r)return false;m=r.meta;m.picURL=URL.createObjectURL(r.pic);m.labURL=URL.createObjectURL(r.lab)}
  else{const r=await fetch('maps/'+id+'.json');if(!r.ok)return false;m=await r.json();m.picURL='maps/'+id+'_pic.jpg';m.labURL=m.lab}
  await prepRaster(m);MAPCACHE[id]=m}
 setMapData(m);return true}catch(e){console.error(e);return false}}
function idb(op,arg){return new Promise((res,rej)=>{let rq;try{rq=indexedDB.open('frontline',1)}catch(e){return res(op==='all'?[]:null)}
 rq.onupgradeneeded=()=>rq.result.createObjectStore('maps',{keyPath:'id'});rq.onerror=()=>res(op==='all'?[]:null);
 rq.onsuccess=()=>{try{const tx=rq.result.transaction('maps',op==='get'||op==='all'?'readonly':'readwrite'),st=tx.objectStore('maps');
  const r=op==='get'?st.get(arg):op==='all'?st.getAll():op==='put'?st.put(arg):st.delete(arg);r.onsuccess=()=>res(r.result);r.onerror=()=>rej(r.error)}catch(e){rej(e)}}})}
async function unzipBytes(buf){const dv=new DataView(buf.buffer,buf.byteOffset,buf.byteLength);let e=buf.length-22;while(e>0&&dv.getUint32(e,true)!==0x06054b50)e--;if(e<=0)throw new Error('Not a zip file');
 const n=dv.getUint16(e+10,true);let p=dv.getUint32(e+16,true);const files={};
 for(let i=0;i<n;i++){const method=dv.getUint16(p+10,true),cs=dv.getUint32(p+20,true),nl=dv.getUint16(p+28,true),xl=dv.getUint16(p+30,true),cl=dv.getUint16(p+32,true),off=dv.getUint32(p+42,true);
  const name=new TextDecoder().decode(buf.slice(p+46,p+46+nl));p+=46+nl+xl+cl;if(name.endsWith('/'))continue;
  const lnl=dv.getUint16(off+26,true),lxl=dv.getUint16(off+28,true),data=buf.slice(off+30+lnl+lxl,off+30+lnl+lxl+cs);
  let out=data;if(method===8)out=new Uint8Array(await new Response(new Blob([data]).stream().pipeThrough(new DecompressionStream('deflate-raw'))).arrayBuffer());
  files[name.split('/').pop().toLowerCase()]=out}return files}
function parseDomMap(txt){const R={files:{},conts:[],T:[],E:[]};let sec='';const seen=new Set();
 for(let l of txt.split(/\r?\n/)){l=l.trim();if(!l||l[0]===';')continue;const m=l.match(/^\[(.+)\]$/);if(m){sec=m[1].toLowerCase();continue}const p=l.split(/\s+/);
  if(sec==='files'&&p.length>1)R.files[p[0]]=p.slice(1).join(' ');
  else if(sec==='continents'&&p.length>1)R.conts.push({name:p[0].replace(/_/g,' '),bonus:+p[1]||0,color:p[2]||'#888'});
  else if(sec==='countries'&&p.length>4)R.T.push({id:'t'+p[0],n:+p[0],name:p[1].replace(/_/g,' '),c:(+p[2])-1,x:+p[3],y:+p[4]});
  else if(sec==='borders'){const a=+p[0];for(const b of p.slice(1).map(Number)){if(a===b)continue;const k=Math.min(a,b)+','+Math.max(a,b);if(!seen.has(k)){seen.add(k);R.E.push(['t'+Math.min(a,b),'t'+Math.max(a,b)])}}}}
 const ids=new Set(R.T.map(t=>t.id));R.E=R.E.filter(([a,b])=>ids.has(a)&&ids.has(b));return R}
async function importZip(file){if(!file)return;importMsg='Importing...';renderSetup();
 try{const f=await unzipBytes(new Uint8Array(await file.arrayBuffer()));const mk=Object.keys(f).find(k=>k.endsWith('.map'));if(!mk)throw new Error('No .map file inside');
  const R=parseDomMap(new TextDecoder('latin1').decode(f[mk]));const lf=(R.files.map||'').split('/').pop().toLowerCase(),pf=(R.files.pic||'').split('/').pop().toLowerCase();
  if(!f[lf]||!f[pf])throw new Error('Map images missing from the zip');if(!R.T.length)throw new Error('No territories found');
  const mime=n=>n.endsWith('.png')?'image/png':n.endsWith('.gif')?'image/gif':'image/jpeg';
  const lab=new Blob([f[lf]],{type:mime(lf)}),pic=new Blob([f[pf]],{type:mime(pf)});
  const li=await decodeImg(URL.createObjectURL(lab));const pu=URL.createObjectURL(pic),img=new Image();img.src=pu;await img.decode();
  const tc=document.createElement('canvas');tc.width=168;tc.height=128;tc.getContext('2d').drawImage(img,0,0,168,128);
  let name=mk.replace(/\.map$/,'').replace(/[_-]+/g,' ');name=name.replace(/\b\w/g,c=>c.toUpperCase());
  const id='imp_'+name.replace(/[^A-Za-z0-9]/g,'').slice(0,24)+'_'+Date.now().toString(36);
  const meta={id,name,W:li.W,H:li.H,conts:R.conts,T:R.T,E:R.E},thumbURL=tc.toDataURL('image/jpeg',.75);
  await idb('put',{id,meta,pic,lab,thumb:thumbURL});IMPORTED.push({id,name,n:R.T.length,thumb:thumbURL});
  CFG.map=id;saveCfg();importMsg=`Imported ${name} (${R.T.length} territories).`}
 catch(e){importMsg='Could not import that file: '+e.message}renderSetup()}
async function removeImport(id){await idb('del',id);IMPORTED=IMPORTED.filter(m=>m.id!==id);delete MAPCACHE[id];if(CFG.map===id){CFG.map='classic';saveCfg()}renderSetup()}
function mapsPage(){const cell=(m,extra='')=>`<div class="cell" onclick="CFG.map='${m.id}';saveCfg();setupPage='main';renderSetup()"><div class="thumb">${m.thumb?`<img src="${m.thumb}" style="width:84px;height:64px;object-fit:cover">`:thumb()}</div><span class="main">${m.name}<span class="by">${m.by||'By: Domination community'}${m.n?' &middot; '+m.n+' territories':''}</span></span>${extra}${CFG.map===m.id?'<span class="chk">&#x2713;</span>':''}</div>`;
 return`<div class="nav"><a onclick="setupPage='main';renderSetup()">&#x2039; Back</a><span class="t">Select Map</span><a></a></div>
 <div class="sec"><label class="cell" style="cursor:pointer"><span class="main">Import Map (.zip)<span class="by">Any Domination map zip, kept on this device</span></span><span class="chev">+</span><input type="file" accept=".zip,application/zip" style="display:none" onchange="importZip(this.files[0])"></label></div>
 ${importMsg?`<p class="note">${importMsg}</p>`:''}
 <div class="sec">${cell({id:'classic',name:'Classic World',by:'By: Frontline',n:42})}${IMPORTED.map(m=>cell({...m,by:'Imported'},`<span class="val" style="color:#c0392b" onclick="event.stopPropagation();removeImport('${m.id}')">Remove</span>`)).join('')}</div>
 <div class="sec">${MAPINDEX.map(m=>cell(m)).join('')}</div><div style="height:30px"></div>`}
async function loadLibrary(){try{const r=await fetch('maps/index.json');if(r.ok)MAPINDEX=await r.json()}catch(e){}
 try{IMPORTED=(await idb('all')).map(r=>({id:r.id,name:r.meta.name,n:r.meta.T.length,thumb:r.thumb}))}catch(e){}
 if(!document.body.classList.contains('ingame'))renderSetup()}

/* ---------- draggable legend ---------- */
let legPos=(()=>{try{return JSON.parse(localStorage.getItem('frontline-legend'))}catch(e){return null}})(),legDrag=null;
function appPt(cx,cy){const w=innerWidth,h=innerHeight;return h>w?{x:h-cy,y:cx}:{x:cx,y:cy}}
function applyLeg(){const L=$('#legend'),A=$('#mapArea');if(!legPos){L.classList.remove('free');L.style.left='0';L.style.top='';L.style.bottom='0';return}
 const W=A.clientWidth-L.offsetWidth,H=A.clientHeight-L.offsetHeight;L.classList.add('free');L.style.bottom='auto';
 L.style.left=Math.max(0,legPos.fx*W)+'px';L.style.top=Math.max(0,legPos.fy*H)+'px'}
(()=>{const L=$('#legend');
 L.addEventListener('pointerdown',e=>{e.stopPropagation();try{L.setPointerCapture(e.pointerId)}catch(_){}const p=appPt(e.clientX,e.clientY);legDrag={p,l:L.offsetLeft,t:L.offsetTop}});
 L.addEventListener('pointermove',e=>{if(!legDrag)return;const A=$('#mapArea'),p=appPt(e.clientX,e.clientY);
  const W=Math.max(1,A.clientWidth-L.offsetWidth),H=Math.max(1,A.clientHeight-L.offsetHeight);
  const l=Math.max(0,Math.min(W,legDrag.l+p.x-legDrag.p.x)),t=Math.max(0,Math.min(H,legDrag.t+p.y-legDrag.p.y));
  legPos={fx:l/W,fy:t/H};applyLeg()});
 const end=()=>{if(!legDrag)return;legDrag=null;try{localStorage.setItem('frontline-legend',JSON.stringify(legPos))}catch(_){}};
 L.addEventListener('pointerup',end);L.addEventListener('pointercancel',end);
 L.addEventListener('dblclick',()=>{legPos=null;try{localStorage.removeItem('frontline-legend')}catch(_){}applyLeg()});
 ['touchstart','touchmove','touchend'].forEach(ev=>L.addEventListener(ev,e=>{e.stopPropagation();if(ev==='touchmove')e.preventDefault()},{passive:false}));
})();

/* ---------- map zoom / pan (map only) ---------- */
let VB={x:0,y:0,w:MAP.W,h:MAP.H},touch=null,dragged=false;
function setVB(x,y,w){w=Math.max(MAP.W/4,Math.min(MAP.W,w));const h=w*MAP.H/MAP.W;
 x=Math.max(0,Math.min(MAP.W-w,x));y=Math.max(0,Math.min(MAP.H-h,y));VB={x,y,w,h};svg.setAttribute('viewBox',`${x} ${y} ${w} ${h}`)}
/* screen point -> map coordinates, computed from layout (not getScreenCTM, which iPhone browsers get wrong
   with rotated or stretched pages) */
function toSvg(cx,cy){const A=$('#mapArea'),a=appPt(cx,cy),lx=a.x-A.offsetLeft,ly=a.y-A.offsetTop,W=A.clientWidth,H=A.clientHeight;
 if(svg.getAttribute('preserveAspectRatio')==='none')return{x:VB.x+lx*VB.w/W,y:VB.y+ly*VB.h/H};
 const s=Math.min(W/VB.w,H/VB.h),ox=(W-VB.w*s)/2,oy=(H-VB.h*s)/2;return{x:VB.x+(lx-ox)/s,y:VB.y+(ly-oy)/s}}
function frac(cx,cy){const p=toSvg(cx,cy);return{x:(p.x-VB.x)/VB.w,y:(p.y-VB.y)/VB.h}}
const mid=t=>({x:(t[0].clientX+t[1].clientX)/2,y:(t[0].clientY+t[1].clientY)/2}),dist=t=>Math.hypot(t[0].clientX-t[1].clientX,t[0].clientY-t[1].clientY);
const MA=$('#mapArea');
MA.addEventListener('touchstart',e=>{const t=e.touches;
 if(t.length===2){const m=mid(t);touch={pinch:true,d:dist(t),w:VB.w,p:toSvg(m.x,m.y)};dragged=true}
 else if(t.length===1){const id=(e.target&&e.target.dataset&&e.target.dataset.id)||(RAS&&G?territoryAt(t[0].clientX,t[0].clientY):null);const mine=id&&G&&G.owner[id]===G.cur&&!G.players[G.cur].ai&&G.phase!=='over';
  touch={pinch:false,noPan:!!mine,sx:t[0].clientX,sy:t[0].clientY,p:toSvg(t[0].clientX,t[0].clientY)};dragged=false}},{passive:false});
MA.addEventListener('touchmove',e=>{e.preventDefault();if(!touch)return;const t=e.touches;
 if(touch.pinch&&t.length===2){const m=mid(t),w=touch.w*touch.d/dist(t);const nw=Math.max(MAP.W/4,Math.min(MAP.W,w)),nh=nw*MAP.H/MAP.W;
  const f=frac(m.x,m.y);setVB(touch.p.x-f.x*nw,touch.p.y-f.y*nh,nw)}
 else if(!touch.pinch&&t.length===1){if(Math.hypot(t[0].clientX-touch.sx,t[0].clientY-touch.sy)>8)dragged=true;
  if(dragged&&!touch.noPan&&VB.w<MAP.W){const f=frac(t[0].clientX,t[0].clientY);setVB(touch.p.x-f.x*VB.w,touch.p.y-f.y*VB.h,VB.w)}}},{passive:false});
MA.addEventListener('touchend',e=>{if(e.touches.length===0)touch=null;else if(e.touches.length===1&&touch&&touch.pinch){const t=e.touches[0];touch={pinch:false,sx:t.clientX,sy:t.clientY,p:toSvg(t.clientX,t.clientY)}}});
MA.addEventListener('click',e=>{if(dragged){e.stopPropagation();e.preventDefault();dragged=false}},true);
svg.addEventListener('pointerdown',e=>{if(e.target.closest&&e.target.closest('.card'))return;const id=resolveTap(e.clientX,e.clientY);if(id){holdStart(id,e);slideStart(territoryExact(e.clientX,e.clientY)||id,e)}});
svg.addEventListener('click',e=>{if(e.target.closest&&e.target.closest('.card'))return;const id=resolveTap(e.clientX,e.clientY);if(id)onTap(id)});
MA.addEventListener('wheel',e=>{e.preventDefault();const p=toSvg(e.clientX,e.clientY),f=frac(e.clientX,e.clientY),nw=Math.max(MAP.W/4,Math.min(MAP.W,VB.w*(e.deltaY>0?1.15:0.87))),nh=nw*MAP.H/MAP.W;setVB(p.x-f.x*nw,p.y-f.y*nh,nw)},{passive:false});
['gesturestart','gesturechange','gestureend'].forEach(ev=>document.addEventListener(ev,e=>e.preventDefault(),{passive:false}));
document.addEventListener('touchmove',e=>{if(document.body.classList.contains('ingame')&&e.touches.length>1)e.preventDefault()},{passive:false});

buildMap();layout();renderSetup();loadLibrary();
if('serviceWorker' in navigator&&/github\.io$/.test(location.hostname)){navigator.serviceWorker.register('sw.js').catch(()=>{})}
</script>
